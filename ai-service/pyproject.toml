[project]
name = "insighthub-ai-service"
version = "0.1.0"
description = "InsightHub AI service: ingestion, RAG, generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

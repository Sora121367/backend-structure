[project]
name = "insighthub-ai-service"
version = "0.1.0"
description = "InsightHub AI service: ingestion, RAG, generation"
requires-python = ">=3.12"
dependencies = []   # added by the AI owner when implementation starts (fastapi, sqlalchemy, pgvector, alembic, ...)

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

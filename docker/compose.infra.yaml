# Shared infrastructure used by both Spring Boot and the AI service (local dev only).
# Production uses its own deployment config (HTTPS proxy, Keycloak `start`, real secrets).
services:
  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes: [keycloak-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0   # pinned; upgrade by PR only (26.8.1 has security fixes)
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8180   # one issuer for browser, IDE and containers
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports: ["8180:8080"]
    depends_on:
      keycloak-db: { condition: service_healthy }

  rustfs:   # S3-compatible object storage. S3 API :9000, console http://localhost:9001
    image: rustfs/rustfs:latest   # pin a release tag before sharing environments
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [rustfs:/data]   # if you switch to a host folder: chown -R 10001:10001 <folder> (container runs as UID 10001)

  redis:
    image: redis:7
    ports: ["6379:6379"]

  mailpit:   # catches all emails (welcome, OTP) — UI at http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  keycloak-db: {}
  rustfs: {}